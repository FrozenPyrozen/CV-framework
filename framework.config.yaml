# Framework configuration: every value scripts and agents use instead of hard-coding (docs/plan.md section 9).
# Per-laptop settings go in framework.local.yaml (git-ignored).
schema_version: 1

spelling: en-US

paths:
  summaries: summaries
  digests: summaries/.digests
  facts: facts
  profiles: profiles
  markets: markets
  templates: templates
  reports: reports
  runs: .cv-runs
  sources: sources                 # imported old CVs and portfolios (specs/sources-spec.md)
  portfolio: portfolio             # the public portfolio (specs/outputs/portfolio.md)

output:
  master_dir: cv
  variants_dir: cv/variants
  tailored_dir: cv/tailored
  markets_subdir: markets            # cv/markets/<id>/, cv/variants/<profile>/markets/<id>/
  file_name: "{name_underscored}_CV{profile_suffix}{market_suffix}"   # Kirill_Kohan_CV, Kirill_Kohan_CV_React_Native_UA

default_template: classic
pdf_exporters: [pages, word, libreoffice]   # framework.local.yaml may override per laptop

# CV sections in order (specs/cv-spec.md section 2)
cv_sections:
  - { id: summary,    heading: SUMMARY,    enabled: true, source: composer }
  - { id: experience, heading: EXPERIENCE, enabled: true, source: entries, show_dates: true }
  - id: consulting
    heading: CONSULTING AND FREELANCE PROJECTS
    enabled: true
    source: entries
    intro: Part-time contract and consulting work, alongside full-time roles
    show_dates: false
  - { id: education,  heading: EDUCATION,  enabled: true, source: profile.education }
  - { id: skills,     heading: SKILLS,     enabled: true, source: skills }
  - { id: languages,  heading: LANGUAGES,  enabled: true, source: profile.languages }

display:
  date_format: "MMMM YYYY"           # December 2025
  date_range_separator: " - "
  present_label: Present
  contract_suffix: " (Contract)"
  field_separator: " | "
  expected_suffix: " (expected)"     # education end year still to come
  bullet_bold_keywords: true         # bold technologies and key terms in bullets (specs/cv-spec.md section 3)

# Header line templates (specs/cv-spec.md section 8). {placeholders} come from facts/profile.yaml;
# a line whose content is empty for the current market is left out.
header:
  location: "{city}, {country}{remote_suffix}"
  remote_suffix: " (Remote)"         # used when profile location.remote is true
  availability:
    template: "Open to {engagement_list} employment"
    labels: { b2b-contract: B2B contract, full-time: full-time, part-time: part-time }
    joiner: " or "
  time_zone_overlap: "Working hours overlap with {overlap_list} time zones"
  contact_order: [phone, email, links]
  link_format: "{label}: {url}"

checks:
  max_pages: 4
  max_words: 2200
  max_bullet_words: 45
  portfolio_max_pages: 40            # page limit of each portfolio PDF (specs/outputs/portfolio.md 6)
  portfolio_max_project_words: 420   # one page per project with its screenshots, as on the published portfolio (up to about 400 words)
  contacts_on_page_1: true
  export_timeout_s: 60
  forbidden_chars: ["→", "·", "•", "—", "–"]
  filler_words: [passionate, results-driven, highly accomplished, leveraged, leverage, synergy, cutting-edge, rockstar, ninja, guru]
  spelling_variants:                 # word to avoid: preferred US spelling (lint warns; spelling: en-US)
    afterwards: afterward
    towards: toward
    colour: color
    behaviour: behavior
    optimise: optimize
    optimised: optimized
    organise: organize
    analyse: analyze
    analysed: analyzed
    modelling: modeling
    licence: license
    centre: center
    favour: favor
    catalogue: catalog

secret_scan:
  allow: []                          # approved values that look like secrets (profile links are always allowed)
  internal_url_patterns: []          # extra patterns besides each summary's url_pattern entries

