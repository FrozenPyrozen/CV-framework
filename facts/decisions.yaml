# Decisions: choices the user made about the CV. Agents follow them; reviewers list matching
# findings under "Decided" instead of raising them again (specs/review-report-spec.md).
schema_version: 1

decisions:
  - id: no-profile-links
    decision: No LinkedIn or GitHub link in the CV header.
    date: "2026-10-15"
    why: User's choice after the ATS review. The links are kept in profile.yaml with show false and can be switched on.
    matches: [missing LinkedIn, missing GitHub, no profile links]

  - id: keep-cv-name
    decision: Keep "Kirill Kohan" as the CV name for now, although the legal name is "Kyrylo Kokhan" and the LinkedIn handle is "kyrylo-kohan".
    date: "2026-10-16"
    why: User's choice ("let it be for now"); profile.yaml show_legal_name can switch it later. HR review should prepare a one-line explanation instead of raising it.
    matches: [name mismatch, legal name, Kyrylo Kokhan, name consistency, LinkedIn name]

  - id: keep-erp-programs-figure
    decision: Keep "renders 1,800+ ERP programs" (counted as 1,891 menu items on a mock backend in local testing); the figure and the level of SYSPRO platform detail are OK to share.
    date: "2026-10-16"
    why: User's choice after the fact-check and confidentiality reviews.
    matches: ["1,800+ ERP programs", mock backend count, current employer detail, SYSPRO platform detail]

  - id: hidden-client-details-ok
    decision: The Generative AI Jira Plugin and Clinical Trials Patient App entries keep their feature details (eCOA, Expo plus native Android, Jira issue to design, PRD uploads, MCP URL, Azure Blob); only the client names stay hidden.
    date: "2026-10-16"
    why: User's choice ("just don't tell the name").
    matches: [hidden client identifiable, narrow down the client, Velocity AI, Clinical Ink, feature list identifies]

  - id: keep-previous-cv-metrics
    decision: Keep the numbers taken from the previous CV ("Forbes top 10", "income grew 10x", "tripled new users", "engagement grew 4x"), and don't fill the empty confidentiality notes of the older summaries (GM, Velas, OMO, Thermo Fisher, Itjet, Admasters) from memory.
    date: "2026-10-16"
    why: User's choice; internal names from those jobs aren't remembered.
    matches: [Forbes top 10, revenue figure, income grew 10x, outcome numbers, None known TODO confidentiality notes]

  - id: keep-contact-and-keywords
    decision: The email kiril.kohan@gmail.com is correct; React.js stays in Skills as an extra keyword.
    date: "2026-10-16"
    why: User confirmed.
    matches: [email spelling, React.js duplicate keyword]

  - id: ai-review-agents-wording
    decision: Describe AI at SYSPRO as "AI review agents" or "AI agents only as governed reviewers", never as "AI coding agents", which can read as if AI wrote the code (also the skill name "AI agent governance (SDD)").
    date: "2026-10-16"
    why: User's choice after the line-by-line validation; supports sdd-not-vibe-coding.
    matches: [AI coding agents, AI-written code, AI agent wording]

  - id: keep-length
    decision: Keep the master CV's current length (about 2,000 words, 3 to 4 pages); don't trim older roles there. Role variants follow their profile's max_pages and max_words and shrink less relevant roles by design.
    date: "2026-10-15"
    why: User's choice; AI screeners don't penalize length. Scoped to the master CV on 2026-10-16.
    matches: [CV too long, trim older roles, page count]

  - id: keep-portfolio-link
    decision: Keep the Google Drive portfolio link in the header.
    date: "2026-10-15"
    why: User's choice. The file must stay shared as "Anyone with the link can view".
    matches: [Google Drive link, portfolio link not parseable]

  - id: keep-title-step
    decision: Keep the title step from Team Leader (General Motors) to Senior Software Engineer (SYSPRO).
    date: "2026-10-15"
    why: The SYSPRO bullets show architecture-level scope; prepare an interview answer instead of changing the title.
    matches: [title step down, Team Leader to Senior Software Engineer]

  - id: consulting-no-dates
    decision: The consulting and freelance section shows no dates.
    date: "2026-10-15"
    why: User's choice.
    matches: [missing dates in consulting, freelance dates]

  - id: hidden-clients
    decision: The Clinical Ink and Velocity AI clients stay hidden behind their CV labels.
    date: "2026-10-15"
    why: User removed the client names from the CV.
    matches: [client name missing, unnamed client]

  - id: sdd-not-vibe-coding
    decision: SYSPRO work is presented as architecture-governed specification-driven development, with AI agents as governed reviewers, never as AI-generated code.
    date: "2026-10-15"
    why: User's explicit priority; also a rule in specs/cv-spec.md section 5.
    matches: [AI-generated code, vibe coding, defensive wording about AI]

  - id: all-full-time
    decision: All jobs, including OMO Systems, Thermo Fisher Scientific and The Admasters, are recorded as full-time, so no full-time entry carries a "(Contract)" label (only the two consulting contracts do). Short tenures are explained in interviews, not with labels.
    date: "2026-10-15"
    why: User confirmed the employment type ("leave it as full-time for now"); a contract label is only allowed when true. Revisit if any of these was in fact a contract.
    matches: [short tenure, job hopping, contract label]
