# Decisions: choices the user made about the CV. Agents follow them; reviewers list matching
# findings under "Decided" instead of raising them again (specs/review-report-spec.md).
schema_version: 1

decisions:
  - id: no-profile-links
    decision: No LinkedIn or GitHub link in the CV header.
    date: "2026-10-15"
    why: User's choice after the ATS review. The links are kept in profile.yaml with show false and can be switched on.
    matches: [missing LinkedIn, missing GitHub, no profile links]

  - id: keep-cv-name
    decision: Keep "Kirill Kohan" as the CV name for now, although the legal name is "Kyrylo Kokhan" and the LinkedIn handle is "kyrylo-kohan".
    date: "2026-10-16"
    why: User's choice ("let it be for now"); profile.yaml show_legal_name can switch it later. HR review should prepare a one-line explanation instead of raising it.
    matches: [name mismatch, legal name, Kyrylo Kokhan, name consistency, LinkedIn name]

  - id: keep-erp-programs-figure
    decision: Keep "renders 1,800+ ERP programs" (counted as 1,891 menu items on a mock backend in local testing); the figure and the level of SYSPRO platform detail are OK to share.
    date: "2026-10-16"
    why: User's choice after the fact-check and confidentiality reviews.
    matches: ["1,800+ ERP programs", mock backend count, current employer detail, SYSPRO platform detail]

  - id: hidden-client-details-ok
    decision: The Generative AI Jira Plugin and Clinical Trials Patient App entries keep their feature details (eCOA, Expo plus native Android, Jira issue to design, PRD uploads, MCP URL, Azure Blob); only the Velocity AI client name stays hidden (Clinical Ink is named since 2026-10-24, decision hidden-clients).
    date: "2026-10-16"
    why: User's choice ("just don't tell the name").
    matches: [hidden client identifiable, narrow down the client, Velocity AI, Clinical Ink, feature list identifies]

  - id: keep-previous-cv-metrics
    decision: Keep the numbers taken from the previous CV ("Forbes top 10", "income grew 10x", "tripled new users", "engagement grew 4x"), and don't fill the empty confidentiality notes of the older summaries (GM, Velas, OMO, Thermo Fisher, Itjet, Admasters) from memory.
    date: "2026-10-16"
    why: "User's choice; internal names from those jobs aren't remembered. Exception (2026-10-22): the Velas staking figure '12x faster' was replaced by the user-confirmed '2 minutes to 5 seconds' from the April 2025 portfolio."
    matches: [Forbes top 10, revenue figure, income grew 10x, outcome numbers, None known TODO confidentiality notes]

  - id: keep-contact-and-keywords
    decision: The email kiril.kohan@gmail.com is correct; React.js stays in Skills as an extra keyword.
    date: "2026-10-16"
    why: User confirmed.
    matches: [email spelling, React.js duplicate keyword, React.js, React 19 and React.js, two forms of React]

  - id: ai-agents-wording
    decision: At SYSPRO, describe the AI agents truthfully as implementing and reviewing code against the specifications under human review (e.g. "rules for AI agents that implement and review code against the specifications"). Never "AI review agents" or "only as reviewers" (narrower than the source), never AI as the designer, never ad-hoc code generation. Skill name "AI agent governance (SDD)".
    date: "2026-10-20"
    why: User confirmed on 2026-10-20 that the agents implemented and reviewed code, governed by the SDD process; replaces ai-review-agents-wording (2026-10-16), whose wording said less than the sources.
    matches: [AI coding agents, AI-written code, AI review agents, only as reviewers, AI agent wording]

  - id: summary-no-company-names
    decision: The summary paragraph names no companies or clients (SYSPRO, General Motors, Itjet, Velas …) and says nothing about when things happened; it describes general experience in past tense ("built…", "led a team of 8…", "for an automotive manufacturer") with no "currently", "previously" or "earlier". Names and dates stay in the entries.
    date: "2026-10-20"
    why: User's choice.
    matches: [company names in summary, summary names employers, employer not named in summary, current role not stated in summary, timing words in summary]

  - id: keep-length
    decision: Keep the master CV's current length (about 2,300 words, within checks.max_words; 3 to 4 pages); don't trim older roles there. Role variants follow their profile's max_pages and max_words and shrink less relevant roles by design.
    date: "2026-10-15"
    why: User's choice; AI screeners don't penalize length. Scoped to the master CV on 2026-10-16. checks.max_words raised from 2,200 to 2,320 on 2026-10-23 for the two HERE Technologies consulting entries (user).
    matches: [CV too long, trim older roles, page count]

  - id: keep-portfolio-link
    decision: Keep the Google Drive portfolio link in the header.
    date: "2026-10-15"
    why: User's choice. The file must stay shared as "Anyone with the link can view".
    matches: [Google Drive link, portfolio link not parseable]

  - id: keep-title-step
    decision: Keep the title step from Team Leader (General Motors) to Senior Software Engineer (SYSPRO).
    date: "2026-10-15"
    why: The SYSPRO bullets show architecture-level scope; prepare an interview answer instead of changing the title.
    matches: [title step down, Team Leader to Senior Software Engineer]

  - id: consulting-no-dates
    decision: The consulting and freelance section shows no dates.
    date: "2026-10-15"
    why: User's choice.
    matches: [missing dates in consulting, freelance dates]

  - id: hidden-clients
    decision: The Velocity AI client stays hidden behind its CV label. Clinical Ink is named in the CV and the portfolio since 2026-10-24 (the user said its name is not confidential).
    date: "2026-10-15"
    why: User removed the client names from the CV.
    matches: [client name missing, unnamed client]

  - id: sdd-not-vibe-coding
    decision: SYSPRO work is presented as architecture-governed specification-driven development, never as ad-hoc AI code generation. AI agents implemented and reviewed code against the specifications under human review (wording updated 2026-10-20, see ai-agents-wording).
    date: "2026-10-15"
    why: User's explicit priority; also a rule in specs/cv-spec.md section 5.
    matches: [AI-generated code, vibe coding, defensive wording about AI]

  - id: all-full-time
    decision: All jobs, including OMO Systems, Thermo Fisher Scientific and The Admasters, are recorded as full-time, so no full-time entry carries a "(Contract)" label (only the two consulting contracts do). Short tenures are explained in interviews, not with labels.
    date: "2026-10-15"
    why: User confirmed the employment type ("leave it as full-time for now"); a contract label is only allowed when true. Revisit if any of these was in fact a contract.
    matches: [short tenure, job hopping, contract label]

  - id: itjet-client-names
    decision: The Itjet entry names its client projects (Aspiration, RegiStart, Fused; Wink, Golfuture and Oroscopo are in the summary) in the CV; Itjet was a services company with several clients, not one fintech product.
    date: "2026-10-22"
    why: User confirmed the client split and that the client names may appear in the CV (portfolio import, doc:portfolio-2025-04).
    matches: [Aspiration, RegiStart, Fused, Wink, client names, Itjet clients]

  - id: portfolio-client-names
